<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Punto de Control - Escáner Tablet</title>
  
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="/static/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .card {
      background: #151d30;
      border: 1px solid #243049;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    /* PIN View */
    .pin-input {
      width: 100%;
      padding: 16px;
      background: #0b0f19;
      border: 1.5px solid #243049;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1.4rem;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      margin: 16px 0;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    /* Scanner View */
    .camera-box {
      position: relative;
      width: 100%;
      height: 380px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      display: none;
    }
    /* Retícula de escaneo */
    .scan-guide {
      position: absolute;
      width: 240px;
      height: 240px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      pointer-events: none;
    }
    .scan-guide::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
      animation: scanAnim 2.5s infinite ease-in-out;
    }
    @keyframes scanAnim {
      0% { top: 0%; opacity: 0.8; }
      50% { top: 98%; opacity: 1; }
      100% { top: 0%; opacity: 0.8; }
    }
    /* Modos de marcado */
    .mode-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-btn {
      padding: 10px;
      background: #0b0f19;
      border: 1.5px solid #243049;
      border-radius: 10px;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
    }
    /* Overlay de Resultado */
    .result-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .result-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .result-overlay.success-in {
      background: rgba(16, 185, 129, 0.95);
    }
    .result-overlay.success-out {
      background: rgba(37, 99, 235, 0.95);
    }
    .result-overlay.info {
      background: rgba(217, 119, 6, 0.95);
    }
    .result-overlay.error {
      background: rgba(225, 29, 72, 0.95);
    }
    .result-icon {
      font-size: 56px;
      margin-bottom: 8px;
    }
    .result-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .result-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .result-time {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .camera-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .camera-switch-btn {
      background: none;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      font-weight: 600;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📷 Punto de Control</h1>
      <p class="subtitle">Escáner de Asistencia para Tablet</p>
    </div>

    <!-- PANTALLA DE ACCESO (PIN) -->
    <div id="pinView" class="card">
      <h2 style="font-size: 1.15rem; text-align: center;">🔐 Acceso al Punto de Control</h2>
      <p style="font-size: 0.85rem; color: #94a3b8; text-align: center; margin-top: 4px;">
        Ingrese la clave de acceso de la tablet.
      </p>

      <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="8">
      <button class="btn btn-primary" onclick="validarPin()">Ingresar al Escáner</button>
      <div id="pinError" style="color: #f87171; text-align: center; font-size: 0.85rem; margin-top: 10px; display: none;">
        ❌ Clave incorrecta
      </div>
    </div>

    <!-- PANTALLA PRINCIPAL DEL ESCÁNER -->
    <div id="scannerView" class="card hidden">
      <!-- Selector de Tipo -->
      <div class="mode-selector">
        <button class="mode-btn active" id="btnModeAuto" onclick="setModo('auto')">🔄 Automático</button>
        <button class="mode-btn" id="btnModeEntrada" onclick="setModo('entrada')">🟢 Entrada</button>
        <button class="mode-btn" id="btnModeSalida" onclick="setModo('salida')">🔴 Salida</button>
      </div>

      <!-- Cuadro de Cámara -->
      <div class="camera-box">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="scan-guide"></div>

        <!-- Overlay animado con el resultado -->
        <div id="resultOverlay" class="result-overlay">
          <div id="resultIcon" class="result-icon">✅</div>
          <div id="resultTitle" class="result-title">ENTRADA REGISTRADA</div>
          <div id="resultName" class="result-name">Nombre Funcionario</div>
          <div id="resultTime" class="result-time">10:30:15</div>
        </div>
      </div>

      <div class="camera-controls">
        <span id="cameraStatus">🟢 Cámara activa — Presente el QR</span>
        <button class="camera-switch-btn" onclick="alternarCamara()">🔄 Cambiar Cámara</button>
      </div>
    </div>
  </div>

  <script>
    let modoActual = 'auto';
    let videoStream = null;
    let scanEnPausa = false;
    let camaraFacing = 'environment'; // trasera por defecto en tablet

    // Generador de tono de audio (Beep de confirmación)
    function reproducirBeep(tipo = 'success') {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (tipo === 'success') {
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); // A5
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.25);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.35);
        }
      } catch (e) {
        console.log('Audio no soportado o bloqueado:', e);
      }
    }

    function setModo(modo) {
      modoActual = modo;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      if (modo === 'auto') document.getElementById('btnModeAuto').classList.add('active');
      if (modo === 'entrada') document.getElementById('btnModeEntrada').classList.add('active');
      if (modo === 'salida') document.getElementById('btnModeSalida').classList.add('active');
    }

    async function validarPin() {
      const pin = document.getElementById('pinInput').value.trim();
      const res = await fetch('/api/verificar-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pin })
      });
      const data = await res.json();
      if (data.ok) {
        sessionStorage.setItem('tablet_autenticado', 'true');
        iniciarEscaner();
      } else {
        document.getElementById('pinError').style.display = 'block';
      }
    }

    function alternarCamara() {
      camaraFacing = (camaraFacing === 'environment') ? 'user' : 'environment';
      iniciarCamara();
    }

    async function iniciarEscaner() {
      document.getElementById('pinView').classList.add('hidden');
      document.getElementById('scannerView').classList.remove('hidden');
      await iniciarCamara();
    }

    async function iniciarCamara() {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
      }
      const video = document.getElementById('video');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: camaraFacing, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = videoStream;
        video.setAttribute('playsinline', true);
        await video.play();
        requestAnimationFrame(bucleEscaneo);
      } catch (err) {
        console.error('Error al acceder a la cámara:', err);
        document.getElementById('cameraStatus').innerText = '❌ Error: Active permisos de cámara.';
      }
    }

    // Detector nativo si existe
    const tieneBarcodeDetector = ('BarcodeDetector' in window);
    let barcodeDetector = null;
    if (tieneBarcodeDetector) {
      try {
        barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch (e) {
        console.log('BarcodeDetector no soportó qr_code, usando jsQR');
      }
    }

    async function bucleEscaneo() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');

      if (video.readyState === video.HAVE_ENOUGH_DATA && !scanEnPausa) {
        let codigoDetectado = null;

        // Intentar con API nativa primero
        if (barcodeDetector) {
          try {
            const barcodes = await barcodeDetector.detect(video);
            if (barcodes.length > 0) {
              codigoDetectado = barcodes[0].rawValue;
            }
          } catch (e) {}
        }

        // Fallback a jsQR
        if (!codigoDetectado && window.jsQR) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const qr = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert"
          });
          if (qr && qr.data) {
            codigoDetectado = qr.data;
          }
        }

        if (codigoDetectado) {
          await procesarCodigo(codigoDetectado);
        }
      }

      requestAnimationFrame(bucleEscaneo);
    }

    async function procesarCodigo(payload) {
      scanEnPausa = true;

      try {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payload: payload, tipo: modoActual })
        });
        const data = await res.json();
        mostrarResultado(data);
      } catch (err) {
        mostrarResultado({ ok: false, mensaje: 'Error de red con el servidor.' });
      }

      // Pausa de 3.2 segundos antes de volver a escanear
      setTimeout(() => {
        ocultarResultado();
        scanEnPausa = false;
      }, 3200);
    }

    function mostrarResultado(data) {
      const overlay = document.getElementById('resultOverlay');
      const icon = document.getElementById('resultIcon');
      const title = document.getElementById('resultTitle');
      const name = document.getElementById('resultName');
      const time = document.getElementById('resultTime');

      overlay.className = 'result-overlay visible';

      if (data.ok) {
        reproducirBeep('success');
        if (data.tipo === 'entrada') {
          overlay.classList.add('success-in');
          icon.innerText = '✅';
          title.innerText = '¡ENTRADA REGISTRADA!';
        } else {
          overlay.classList.add('success-out');
          icon.innerText = '👋';
          title.innerText = '¡SALIDA REGISTRADA!';
        }
        name.innerText = (data.funcionario && data.funcionario.nombre) ? data.funcionario.nombre : (data.funcionario_id || '');
        const hora = (data.evento && data.evento.timestamp) ? data.evento.timestamp.substring(11, 19) : new Date().toLocaleTimeString();
        time.innerText = `Hora: ${hora} | RUT: ${data.funcionario ? data.funcionario.id : ''}`;
      } else {
        reproducirBeep('error');
        if (data.ya_en_recinto) {
          overlay.classList.add('info');
          icon.innerText = '🏢';
          title.innerText = 'YA EN EL RECINTO';
          name.innerText = (data.funcionario && data.funcionario.nombre) ? data.funcionario.nombre : '';
          time.innerText = data.mensaje;
        } else if (data.jornada_completada) {
          overlay.classList.add('info');
          icon.innerText = '🔒';
          title.innerText = 'JORNADA COMPLETADA';
          name.innerText = (data.funcionario && data.funcionario.nombre) ? data.funcionario.nombre : '';
          time.innerText = data.mensaje;
        } else {
          overlay.classList.add('error');
          icon.innerText = '⚠️';
          title.innerText = 'NO REGISTRADO';
          name.innerText = data.mensaje || 'Código no válido';
          time.innerText = data.anti_rebote ? 'Espere unos segundos para volver a marcar.' : 'Compruebe su código en su teléfono.';
        }
      }
    }

    function ocultarResultado() {
      const overlay = document.getElementById('resultOverlay');
      overlay.className = 'result-overlay';
    }

    // Auto-login si ya estaba autenticado en la sesión
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('tablet_autenticado') === 'true') {
        iniciarEscaner();
      }
    });
  </script>
</body>
</html>
